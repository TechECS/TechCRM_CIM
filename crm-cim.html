a.l{color:var(--lnk);text-decoration:underline}.rt2{color:var(--er)}.mu{color:var(--mu)}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=c=>(c/100).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const dd=d=>d?new Date(d).toLocaleDateString('es-ES'):'';
const iso=n=>new Date(Date.now()+n*864e5).toISOString();
const SL={active:'Activo',trialing:'En prueba',past_due:'Impago',suspended:'Suspendido',cancelled:'Cancelado',provisioning:'Provisionando',provisioning_failed:'Fallo de provisión'};
const OL={pending:'Pendiente',running:'En curso',done:'Completada',failed:'Fallida',skipped:'Omitida',draft:'Pte. Lanzar Procesos',exception:'Excepción',completed:'Cerrada',cancelled:'Cancelada'};
const AC={create:'Alta',update:'Cambio de plan',suspend:'Suspensión',resume:'Reactivación',delete:'Baja'};
const ALLOW={update:['active','trialing'],suspend:['active','trialing','past_due'],resume:['suspended'],delete:['active','trialing','past_due','suspended']};
const EST=['draft','running','exception','completed','cancelled'],OPEN=['running','exception','draft'];
const lim=l=>Object.entries(l).map(([k,v])=>`${k.replace('_',' ')}: ${v.toLocaleString('es-ES')}`).join(' · ');

/* ===== Motor de órdenes simulado (sustituir por la API real) ===== */
let seq=1100,won=98001000,spn=270100002;
const nid=p=>p+(++seq),nwo=()=>String(++won),nsp=()=>String(++spn);
const T=(name,ch=[])=>({id:nid('k'),name,st:'pending',ch,exc:null,attempts:0});
const TPL={
 create:()=>[T('Validar datos del cliente'),T('Reservar plan y licencias'),T('Provisión en el producto',[T('Crear tenant'),T('Crear usuario administrador'),T('Aplicar límites y módulos')]),T('Facturación',[T('Alta en pasarela de pago')]),T('Notificar al cliente')],
 update:()=>[T('Validar cambio de plan'),T('Provisión en el producto',[T('Actualizar entitlements')]),T('Facturación',[T('Prorrateo y nuevo importe')])],
 suspend:()=>[T('Provisión en el producto',[T('Suspender acceso')]),T('Notificar al cliente')],
 resume:()=>[T('Provisión en el producto',[T('Reactivar acceso')]),T('Notificar al cliente')],
 delete:()=>[T('Provisión en el producto',[T('Eliminar tenant y datos')]),T('Facturación',[T('Baja de la suscripción')])]};
const RISK={'Crear tenant':'EXC-504 · Timeout en la API del producto','Alta en pasarela de pago':'EXC-402 · Pago rechazado por la pasarela','Actualizar entitlements':'EXC-409 · Los límites nuevos no son aplicables'};
const leaves=(ns,a=[])=>(ns.forEach(n=>n.ch.length?leaves(n.ch,a):a.push(n)),a);
const tst=n=>{if(!n.ch.length)return n.st;const c=n.ch.map(tst);return c.includes('failed')?'failed':c.includes('running')?'running':c.every(x=>x==='done'||x==='skipped')?'done':c.some(x=>x==='done')?'running':'pending'};
const db={
 products:[{id:'facturacion',name:'Facturación'},{id:'crm',name:'CRM'},{id:'inventario',name:'Inventario'}],
 plans:[
  {id:'p1',product_id:'facturacion',name:'Básico',code:'FACBAS',price:1900,limits:{max_users:3},modules:['facturas']},
  {id:'p2',product_id:'facturacion',name:'Pro',code:'FACPRO',price:4900,limits:{max_users:20},modules:['facturas','informes','api']},
  {id:'p3',product_id:'crm',name:'Starter',code:'CRMSTA',price:2900,limits:{max_users:5,contactos:5000},modules:['contactos','pipeline']},
  {id:'p4',product_id:'crm',name:'Business',code:'CRMBUS',price:7900,limits:{max_users:25,contactos:50000},modules:['contactos','pipeline','automatización']},
  {id:'p5',product_id:'inventario',name:'Estándar',code:'INVEST',price:3900,limits:{max_users:10,almacenes:2},modules:['stock','pedidos']},
  {id:'p6',product_id:'inventario',name:'Pro',code:'INVPRO',price:9900,limits:{max_users:50,almacenes:10},modules:['stock','pedidos','trazabilidad']}],
 customers:[
  {id:'c1',num:'748100221',name:'Talleres Ruiz S.L.',email:'admin@talleresruiz.es',tax_id:'B12345678',phone:'937100221',prov:'Barcelona',city:'Terrassa',cp:'08221',country:'ES',type:'Empresa',cls:'RE',acct:'Corporativa',st:'Activo'},
  {id:'c2',num:'116300845',name:'Clínica Dental Sol S.L.',email:'gerencia@dentalsol.es',tax_id:'B87654321',phone:'932200845',prov:'Barcelona',city:'Sabadell',cp:'08201',country:'ES',type:'Empresa',cls:'RE',acct:'Corporativa',st:'Moroso'},
  {id:'c3',num:'057022918',name:'Laura Vidal Prats',email:'laura.vidal@correo.es',tax_id:'47123456K',phone:'655022918',prov:'Madrid',city:'Alcalá de Henares',cp:'28801',country:'ES',type:'Particular',cls:'RS',acct:'Individual',st:'Activo'},
  {id:'c4',num:'903355017',name:'Marcos Ferrer Olmo',email:'marcos@ferrerolmo.es',tax_id:'39555017X',phone:'688355017',prov:'Valencia',city:'Gandía',cp:'46700',country:'ES',type:'Particular',cls:'RS',acct:'Individual',st:'Desconectado'}],
 subs:[
  {id:'s1',customer_id:'c1',plan_id:'p2',product_id:'facturacion',status:'active',tenant_id:'tn_k29fa1',current_period_end:iso(12)},
  {id:'s2',customer_id:'c1',plan_id:'p3',product_id:'crm',status:'trialing',tenant_id:'tn_x81bq7',current_period_end:iso(9)},
  {id:'s3',customer_id:'c2',plan_id:'p1',product_id:'facturacion',status:'past_due',tenant_id:'tn_m55dd2',current_period_end:iso(-3)},
  {id:'s4',customer_id:'c3',plan_id:'p5',product_id:'inventario',status:'suspended',tenant_id:'tn_p02zz9',current_period_end:iso(-20)},
  {id:'s5',customer_id:'c4',plan_id:'p4',product_id:'crm',status:'provisioning_failed',tenant_id:null,current_period_end:null}],
 orders:[]
};
const find=(k,i)=>db[k].find(x=>x.id===i);
const pname=(pid)=>{const p=find('plans',pid);return find('products',p.product_id).name+' '+p.name};
function mkWO(s,action,plan_id,parent){const o={id:nwo(),kind:'work',customer_id:s.customer_id,sub_id:s.id,action,plan_id,parent,title:AC[action]+' · '+pname(plan_id),status:'running',exc:null,opened:Date.now(),planned:Date.now(),closed:null,creator:'admin',tasks:TPL[action]()};db.orders.push(o);return o}
function rollup(o){if(!o.parent)return;const p=find('orders',o.parent),ch=db.orders.filter(x=>x.parent===p.id);
 p.status=ch.some(c=>c.status==='exception')?'exception':ch.every(c=>c.status==='completed')?'completed':ch.every(c=>c.status==='cancelled')?'cancelled':'running';
 p.exc=(ch.find(c=>c.exc)||{}).exc||null;if(p.status==='completed')p.closed=Date.now()}
function finish(o,s){o.status='completed';o.closed=Date.now();o.exc=null;s.busy=null;
 if(o.action==='create'){s.status='active';s.tenant_id='tn_'+Math.random().toString(36).slice(2,8);s.current_period_end=iso(30)}
 if(o.action==='update')s.plan_id=o.plan_id;
 if(o.action==='suspend')s.status='suspended';
 if(o.action==='resume')s.status='active';
 if(o.action==='delete')s.status='cancelled';
 rollup(o);render()}
function step(o){if(o.status==='cancelled')return;const s=find('subs',o.sub_id),l=leaves(o.tasks).find(x=>x.st==='pending');
 o.status='running';o.exc=null;s.busy=o.action;if(o.action==='create')s.status='provisioning';
 if(!l)return finish(o,s);
 l.st='running';l.attempts++;rollup(o);render();
 setTimeout(()=>{if(o.status==='cancelled')return;
  if(RISK[l.name]&&l.attempts===1&&Math.random()<.4){l.st='failed';l.exc=RISK[l.name];o.status='exception';o.exc=l.exc;s.busy=null;if(o.action==='create')s.status='provisioning_failed';rollup(o);render()}
  else{l.st='done';step(o)}},1000)}
const seedWO=(sid,act,parent,state,days)=>{const s=find('subs',sid),o=mkWO(s,act,s.plan_id,parent),L=leaves(o.tasks);o.opened=o.planned=Date.now()-days*864e5;
 if(state==='completed'){L.forEach(l=>{l.st='done';l.attempts=1});o.status='completed';o.closed=o.opened+36e5}

  return modal('Nueva orden de trabajo',`<div class="sg2"><label>Servicio:</label><select name="sub">${sv.map(s=>`<option value="${s.id}">${esc(pname(s.plan_id))} (${SL[s.status]})</option>`).join('')}</select><label>Operación:</label><select name="action">${['update','suspend','resume','delete'].map(x=>`<option value="${x}">${AC[x]}</option>`).join('')}</select><label>Plan nuevo:</label><select name="plan">${D.plans.map(p=>`<option value="${p.id}">${esc(pname(p.id))}</option>`).join('')}</select></div><p class="mu">El plan nuevo solo se usa en el cambio de plan.</p>`,'Crear orden',async d=>{const id=await api.createWork(d.sub,d.action,d.plan);await go('o:'+id)})}
 if(!o)return;
 if(a==='sign'){await api.sign(o.id);return render()}
 if(a==='launch')return api.launch(o.id).then(render,e=>info('No se puede lanzar',`<p class="er">${esc(e.message)}</p>`));
 if(a==='cancel')return modal('Cancelar orden',`<p>Se cancelarán las tareas pendientes de la orden ${o.id}.<br>Esta acción no se puede deshacer.</p>`,'Cancelar orden',()=>api.cancel(o.id));
 if(a==='retry'||a==='skip'){const n=selNode(D,o),w=ownerOf(D,n.id);await api[a](w.id,n.id);return render()}}
document.addEventListener('click',e=>{const t=e.target,d=t.closest('[data-do]'),w=t.closest('[data-win]'),it=t.closest('[data-itab]'),st=t.closest('[data-stab]'),pk=t.closest('[data-pick]'),mn=t.closest('[data-menu]'),cx=t.closest('[data-cx]'),row=t.closest('tr[data-rid]');
 if(cx)return focus('c:'+cx.dataset.cx);
 if(w)return focus(w.dataset.win);
 if(it){const[i,tb]=it.dataset.itab.split('|');S.tab[i]=tb;return render()}
 if(st){const[i,tb]=st.dataset.stab.split('|');S.sub[i]=tb;return render()}
 if(pk){const[k,id]=pk.dataset.pick.split('|');S.sel[k]=id;return render()}
 if(d)return doit(d.dataset.do);
 if(mn){S.menu=S.menu===mn.dataset.menu?null:mn.dataset.menu;return render()}
 if(row){const g=row.dataset.g,id=row.dataset.rid;if(g.startsWith('of:')){const a=S.offer[g]||(S.offer[g]=[]),i=a.indexOf(id);i<0?a.push(id):a.splice(i,1)}else S.sel[g]=id;S.menu=null;return render()}
 if(S.menu){S.menu=null;render()}});
document.addEventListener('dblclick',e=>{const r=e.target.closest('[data-open]');if(r&&r.dataset.open)go(r.dataset.open)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.flt!==undefined){S.f[t.dataset.flt]=t.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='sf'){e.preventDefault();sync();S.q={...S.draft};S.sel.search=null;render()}});
function fit(){const f=$('#fit'),a=$('#app'),s=Math.min(1,f.clientWidth/1100);a.style.width=f.clientWidth/s+'px';a.style.height=f.clientHeight/s+'px';a.style.transform='scale('+s+')'}
addEventListener('resize',fit);setInterval(tick,5000);fit();render();
</script>
